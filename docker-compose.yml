# Local development with hot reload: `docker compose up`, then open :3003.
# The source is bind-mounted; to run the image on its own, see the README.
services:
  app:
    build: .
    ports:
      - "3003:3003" # UI; the API is reached through /api on this same port
    volumes:
      - .:/app
      - /app/node_modules
      - devdata:/app/data # json-server's live file, kept out of the repo

volumes:
  devdata:
