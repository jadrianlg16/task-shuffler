# The iPhone app's checks. Only runs on GitHub (macOS runners are free for
# public repos); the same commands work on a Mac with Xcode 16.
name: iOS

on:
  push:
    paths:
      [
        "ios/**",
        "src/**",
        "scripts/parity-fixtures.ts",
        "package.json",
        "package-lock.json",
        ".github/workflows/ios.yml",
      ]
  pull_request:
    paths:
      [
        "ios/**",
        "src/**",
        "scripts/parity-fixtures.ts",
        "package.json",
        "package-lock.json",
        ".github/workflows/ios.yml",
      ]

jobs:
  # The web tests pass and the recorded answers match the web code as it is now.
  parity-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run parity:fixtures -- --check

  # DoneCore's tests (including parity), then the app builds for the simulator.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Newest Xcode 16.x on the runner (the widget bundle needs 16.1 or later).
      # Only numbered installs: a plain lexical sort put the Xcode_16.app alias
      # (16.0, no simulator runtime) last.
      - name: Choose Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16.[0-9]*.app | grep -iv beta | sort -V | tail -1)"
      - name: DoneCore tests
        working-directory: ios/DoneCore
        run: swift test
      - name: Build the app and widgets, run the UI tests
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild test -project Done.xcodeproj -scheme Done \
            -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/Done.xcresult"
      # Screenshots and the accessibility tree of any failed UI test.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Done-xcresult
          path: ${{ runner.temp }}/Done.xcresult
