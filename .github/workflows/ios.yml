# The iPhone app's checks. Only runs on GitHub (macOS runners are free for
# public repos); the same commands work on a Mac with Xcode 26 or later.
name: iOS

on:
  push:
    paths:
      [
        "ios/**",
        "src/**",
        "scripts/parity-fixtures.ts",
        "package.json",
        "package-lock.json",
        ".github/workflows/ios.yml",
      ]
  pull_request:
    paths:
      [
        "ios/**",
        "src/**",
        "scripts/parity-fixtures.ts",
        "package.json",
        "package-lock.json",
        ".github/workflows/ios.yml",
      ]

jobs:
  # The web tests pass and the recorded answers match the web code as it is now.
  parity-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run parity:fixtures -- --check

  # DoneCore's tests (including parity), then the app builds for the simulator.
  swift:
    # The image's default Xcode, 26.x: since 28 April 2026 the App Store only
    # takes builds from Xcode 26 or later, so CI builds with what ships.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: DoneCore tests
        working-directory: ios/DoneCore
        run: swift test
      - name: Build the app and widgets, run the UI tests
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          # An iPhone on the newest iOS runtime: device names change with each
          # Xcode (iPhone 16 → 17 → …), so none is hard-coded.
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-"))
                | .value |= map(select(.name | startswith("iPhone")))
                | select(.value | length > 0))
            | sort_by(.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")
                | [(.major | tonumber), (.minor | tonumber)])
            | last.value[0].udid')
          xcrun simctl list devices | grep "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild test -project Done.xcodeproj -scheme Done \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Done.xcresult"
      # The UI tests again at the largest text size (AX5), on the same build.
      # On 2026-10-15 adding a task passed at the default size and failed here.
      - name: Run the UI tests at the largest text size
        working-directory: ios
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$SIM_UDID" content_size
          xcodebuild test-without-building -project Done.xcodeproj -scheme Done \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Done-AX5.xcresult"
      # Screenshots and the accessibility tree of any failed UI test.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Done-xcresult
          path: |
            ${{ runner.temp }}/Done.xcresult
            ${{ runner.temp }}/Done-AX5.xcresult
