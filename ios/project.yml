# Xcode project spec for XcodeGen. The .xcodeproj, Info.plists and
# entitlements are generated from this file and not committed:
#   cd ios && xcodegen
# Needs Xcode 16.1 or later (see DoneWidgetsBundle.swift).
name: Done
options:
  bundleIdPrefix: dev.adriangaona
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  DoneCore:
    path: DoneCore
targets:
  Done:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - DoneUITests
    sources:
      - path: Done
      - path: Shared
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DoneCore
      - target: DoneWidgets
    info:
      path: Done/Info.plist
      properties:
        CFBundleDisplayName: done.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Helps Siri hear "done." as the app's name.
        INAlternativeAppNames:
          - INAlternativeAppName: Done
            INAlternativeAppNamePronunciationHint: done
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.adriangaona.done
            CFBundleURLSchemes:
              - done
    entitlements:
      path: Done/Done.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.adriangaona.done
    settings:
      base:
        PRODUCT_NAME: Done
        PRODUCT_BUNDLE_IDENTIFIER: dev.adriangaona.done
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DoneWidgets
      - path: Shared
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DoneCore
    info:
      path: DoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: done.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DoneWidgets/DoneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.adriangaona.done
    settings:
      base:
        PRODUCT_NAME: DoneWidgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.adriangaona.done.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES

  DoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DoneUITests
    dependencies:
      - target: Done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adriangaona.done.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Done
